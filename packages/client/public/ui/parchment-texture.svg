<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.012 0.18"
        numOctaves="4"
        seed="37"
        stitchTiles="stitch"
        result="fibers"
      />
      <feColorMatrix
        in="fibers"
        type="matrix"
        values="0.42 0 0 0 0.38  0 0.31 0 0 0.24  0 0 0.18 0 0.08  0 0 0 0.34 0"
        result="warmFibers"
      />
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.026"
        numOctaves="3"
        seed="83"
        stitchTiles="stitch"
        result="mottle"
      />
      <feColorMatrix
        in="mottle"
        type="matrix"
        values="0.2 0 0 0 0.22  0 0.14 0 0 0.12  0 0 0.08 0 0.05  0 0 0 0.2 0"
        result="warmMottle"
      />
      <feBlend in="warmFibers" in2="warmMottle" mode="multiply" />
    </filter>
    <radialGradient id="base" cx="34%" cy="24%" r="82%">
      <stop offset="0" stop-color="#ead7a7" />
      <stop offset="0.56" stop-color="#d8bc83" />
      <stop offset="1" stop-color="#c9a467" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#base)" />
  <rect width="512" height="512" filter="url(#paper)" opacity="0.72" />
</svg>
